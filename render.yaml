services:
  - type: web
    name: portfolio-control-center-api
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: gunicorn server.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://portfolio-intelligence-brief.netlify.app
